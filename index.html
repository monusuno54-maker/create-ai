<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATE AI - Photo & Video Generator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101326;color:white;font-family:Arial,sans-serif;text-align:center;padding:30px 15px}
.container{max-width:650px;margin:40px auto;background:#202542;padding:30px;border-radius:18px}
h1{color:#8b9cff}
p{color:#ddd;line-height:1.6}
input,textarea{width:100%;padding:14px;margin:12px 0;border-radius:9px;border:0}
button{padding:14px 25px;border:0;border-radius:9px;background:#6578ff;color:white;font-size:16px;margin:5px}
.note{font-size:13px;color:#b9c2ff}
</style>
</head>
<body>
<div class="container">
<h1>CREATE AI</h1>
<h2>AI Photo & Video Generator</h2>
<p>Create amazing AI images and videos with your ideas.</p>
<h3>Enter Your Prompt</h3>
<textarea rows="4" placeholder="Describe what you want to create..."></textarea>
<h3>Upload Your Image</h3>
<input type="file" accept="image/*">
<h3>Choose Generation Type</h3>
<button onclick="alert('AI generation API will be connected in the next step.')">Generate Photo</button>
<button onclick="alert('AI video API will be connected in the next step.')">Generate Video</button>
<p class="note">AI generation services will be connected later.</p>
</div>
</body>
</html>
